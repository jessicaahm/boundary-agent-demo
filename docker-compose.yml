# 3-tier demo stack:  nginx (:8080) -> Flask app (:5000) -> Postgres (:5432)
#
# Container names are fixed (demo-nginx / demo-app / demo-db) because the chaos
# scripts and the eval's ground truth (ai-agent/evals/incidents.py) address them
# by name. Only nginx publishes a host port; app and db are reachable only on the
# internal compose network, exactly as the README describes.

services:
  db:
    image: postgres:16
    container_name: demo-db
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass        # matches chaos/lib.sh APP_DB_PASS
      POSTGRES_DB: storefront
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d storefront"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: ./app
    container_name: demo-app
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: storefront
      DB_USER: appuser
      DB_PASSWORD: apppass              # the app's stored password; break-db-password.sh
                                        # rotates the DB's copy to make this stale
    depends_on:
      db:
        condition: service_healthy
    # No host port: nginx reaches it as app:5000 on the compose network.
    expose:
      - "5000"

  nginx:
    image: nginx:1.27
    container_name: demo-nginx
    ports:
      - "8080:8080"
    volumes:
      # Bind mount (not COPY) on purpose: the 502 fix must edit this file on the
      # host-mounted path. An in-place `sed -i` inside the container fails with
      # "Device or resource busy" — that's the documented trap the eval forbids.
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

volumes:
  db-data:
