# nginx front door for the demo storefront.
#
# The upstream MUST be written as app:5000 (the real Flask port). break-nginx.sh
# swaps 5000 -> 5001 to cause a 502; the fix swaps it back, validates with
# `nginx -t`, and reloads. Keep the literal "app:5000" on one line so the sed in
# the chaos/fix scripts matches.

upstream flask_app {
    server app:5000;
}

server {
    listen 8080;
    server_name _;

    # Proves nginx itself is alive even when the app/db are down.
    location /nginx-health {
        add_header Content-Type application/json;
        return 200 '{"nginx":"ok"}';
    }

    location / {
        proxy_pass http://flask_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Surface upstream failures as the status codes the eval asserts on
        # (502 when the upstream is unreachable).
        proxy_next_upstream off;
    }
}
